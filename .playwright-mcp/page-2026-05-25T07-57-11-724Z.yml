              - paragraph [ref=e331]: 这个博客终于开始像一个真正属于自己的地方了。
              - paragraph [ref=e332]: 它不是一个很正式的作品集，也不是只用来堆技术笔记的仓库。对我来说，它更像一个长期打开的工作台：想到什么、做了什么、踩了什么坑、看了什么番、折腾了什么工具，都可以慢慢放在这里。
